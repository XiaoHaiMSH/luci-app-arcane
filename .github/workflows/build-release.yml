name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      commit_message: ${{ steps.commit.outputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate release tag
        id: tag
        run: echo "release_tag=arcane-$(date -u +%Y.%m.%d)-r$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve commit message
        id: commit
        run: |
          {
            echo "message<<COMMIT_MSG_EOF"
            git log -1 --pretty=%B
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

  build-arcane:
    name: Build arcane (${{ matrix.platform_name }}, ${{ matrix.pkg_format }})
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: ARM64
            pkg_format: apk
            arch_suffix: arm64
            sdk_base: snapshots
            sdk_path: qualcommax/ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
            target: qualcommax
            subtarget: ipq60xx
          - platform_name: AMD64
            pkg_format: apk
            arch_suffix: x86_64
            sdk_base: snapshots
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-x86-64_
            target: x86
            subtarget: '64'

    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/${{ matrix.sdk_base }}/targets/${{ matrix.sdk_path }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip xsltproc zip zlib1g-dev zstd

      - name: Locate SDK
        id: sdk
        run: |
          sums_file="$RUNNER_TEMP/immortalwrt-sha256sums"
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$sums_file"

          archive=''
          sha256=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < "$sums_file"

          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Download SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          archive="$RUNNER_TEMP/sdk/$SDK_ARCHIVE"

          curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive"
          echo "$SDK_SHA256  $archive" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/sdk-root"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/sdk-root"
          echo "SDK_ROOT=$(find "$RUNNER_TEMP/sdk-root" -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Prepare packages
        run: |
          rm -rf "$SDK_ROOT/package/arcane"
          cp -a arcane "$SDK_ROOT/package/arcane"
          rm -rf "$SDK_ROOT/package/luci-app-arcane"
          cp -a luci-app-arcane "$SDK_ROOT/package/luci-app-arcane"

      - name: Update and install feeds
        run: |
          "$SDK_ROOT/scripts/feeds" update -a
          "$SDK_ROOT/scripts/feeds" install -a

      - name: Configure packages
        run: |
          cat > "$SDK_ROOT/.config" <<EOF
          CONFIG_TARGET_${{ matrix.target }}=y
          CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_PACKAGE_arcane=m
          CONFIG_PACKAGE_luci-app-arcane=m
          EOF

          make -C "$SDK_ROOT" defconfig

      - name: Compile packages
        run: |
          make -C "$SDK_ROOT" package/arcane/clean
          make -C "$SDK_ROOT" -j"$(nproc)" \
            package/arcane/compile \
            package/luci-app-arcane/compile || \
            make -C "$SDK_ROOT" -j1 \
              package/arcane/compile \
              package/luci-app-arcane/compile V=s

      - name: Collect packages
        env:
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
          PKG_FORMAT: ${{ matrix.pkg_format }}
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          arcane_found=0
          luci_found=0

          while IFS= read -r -d '' apk; do
            metadata="$("$SDK_ROOT/staging_dir/host/bin/apk" adbdump "$apk")"
            name="$(awk '/^  name: / { sub(/^  name: /, ""); print; exit }' <<< "$metadata")"

            if [[ "$name" == "arcane" ]]; then
              base="$(basename "$apk")"
              version_part="${base#arcane-}"
              version_part="${version_part%.apk}"
              cp -p "$apk" "$RUNNER_TEMP/output/arcane_${ARCH_SUFFIX}-${version_part}.apk"
              arcane_found=$((arcane_found + 1))
            elif [[ "$name" == "luci-app-arcane" ]]; then
              base="$(basename "$apk")"
              version_part="${base#luci-app-arcane-}"
              version_part="${version_part%.apk}"
              cp -p "$apk" "$RUNNER_TEMP/output/luci-app-arcane-${version_part}.apk"
              luci_found=$((luci_found + 1))
            fi
          done < <(find "$SDK_ROOT/bin" -type f \
            \( -name 'arcane-*.apk' -o -name 'luci-app-arcane-*.apk' \) -print0)

          [[ "$arcane_found" -eq 1 ]]
          [[ "$luci_found" -ge 1 ]]

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: arcane-${{ matrix.pkg_format }}-${{ matrix.platform_name }}
          path: ${{ runner.temp }}/output
          if-no-files-found: error

  release:
    name: Publish combined release
    needs: [tag, build-arcane]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Flatten packages
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -print0 | while IFS= read -r -d '' f; do
            cp -f "$f" "$RUNNER_TEMP/release/"
          done

          echo "=== SHA256SUMS (log only, not published to the release) ==="
          cd "$RUNNER_TEMP/release"
          sha256sum -- *

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.release_tag }}
          TITLE: ${{ needs.tag.outputs.release_tag }}
          NOTES: ${{ needs.tag.outputs.commit_message }}
        run: |
          cd "$RUNNER_TEMP/release"

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release_notes.txt"

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release_notes.txt" \
            -- * \
            || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
